[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpycr"
version = "1.2.0"
description = "qPCR Analysis with Recursive PCR Model for robust quantification"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sean D. Moore", email = "sean.moore@ucf.edu"}
]
maintainers = [
    {name = "Sean D. Moore", email = "sean.moore@ucf.edu"}
]
keywords = [
    "qPCR",
    "PCR",
    "quantitative PCR",
    "real-time PCR",
    "molecular biology",
    "bioinformatics",
    "data analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]

[project.scripts]
qpycr = "qpycr.cli:main"

[project.urls]
Homepage = "https://github.com/sdmoore-labs/qPyCR"
Documentation = "https://github.com/sdmoore-labs/qPyCR#readme"
Repository = "https://github.com/sdmoore-labs/qPyCR"
Issues = "https://github.com/sdmoore-labs/qPyCR/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qpycr*"]

[tool.setuptools.package-data]
qpycr = ["*.md"]
